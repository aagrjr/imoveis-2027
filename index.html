<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Apartamentos 2027</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #1c2230; --border: #2a3140;
    --text: #e6edf3; --muted: #7d8590;
    --good: #34d399; --good-bg: #061f17; --good-border: #0d4a30;
    --warn: #fbbf24; --warn-bg: #1f1708; --warn-border: #4a3500;
    --bad: #f87171; --bad-bg: #2a0f0f; --bad-border: #5c1d1d;
    --accent: #60a5fa; --accent-bg: #0d1f3c; --accent-border: #1e3a5f;
  }
  html { scroll-behavior: smooth; font-size: 16px; }
  body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  .site-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 24px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; gap: 16px;
  }
  .site-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em;
    font-family: -apple-system, sans-serif; white-space: nowrap; }
  .header-stats { display: flex; gap: 22px; font-family: -apple-system, sans-serif;
    font-size: 12px; color: var(--muted); }
  .header-stats b { display: block; color: var(--text); font-size: 15px; font-weight: 700; }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  /* ── CONTROLES ─────────────────────────── */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 22px; font-family: -apple-system, sans-serif; font-size: 13px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: .12s;
  }
  .chip:hover { border-color: var(--accent-border); color: var(--text); }
  .chip.on { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
  select, .toggle {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .spacer { flex: 1; }

  /* ── CARDS ─────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px; position: relative;
  }
  .card.st-agendado { border-color: var(--warn-border); }
  .card.st-visitado { border-color: var(--good-border); }
  .card-foto {
    display: block; width: calc(100% + 36px); height: 150px; object-fit: cover;
    margin: -16px -18px 2px; border-radius: 9px 9px 0 0; background: var(--surface2);
  }
  .card-foto-link { display: block; }
  .card.st-descartado .card-foto { filter: grayscale(1); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .bairro { font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .endereco { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin-top: 2px; }
  .sub { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .fav { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1;
    color: var(--border); padding: 2px; }
  .fav.on { color: var(--warn); }
  .card-acoes { display: flex; gap: 2px; align-items: center; }
  .descartar { background: none; border: none; cursor: pointer; font-size: 15px; line-height: 1;
    color: var(--border); padding: 2px 4px; font-family: -apple-system, sans-serif; }
  .descartar:hover { color: var(--bad); }
  .card.st-descartado .descartar { color: var(--bad); }
  .card.st-descartado { opacity: .45; }
  .card.st-descartado:hover { opacity: .8; }
  #backup { background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 11px; border-radius: 6px; cursor: pointer; font-family: -apple-system, sans-serif;
    font-size: 12px; white-space: nowrap; }
  #backup:hover { color: var(--text); border-color: var(--accent-border); }
  #backup.ok { color: var(--good); border-color: var(--good-border); }

  .preco { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .preco b { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-family: -apple-system, sans-serif; }
  .m2v { font-family: -apple-system, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
  .m2v.barato { background: var(--good-bg); border-color: var(--good-border); color: var(--good); }
  .m2v.caro { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }

  .specs { display: flex; gap: 14px; font-family: -apple-system, sans-serif; font-size: 13px;
    color: var(--muted); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 9px 0; }
  .specs span b { color: var(--text); font-weight: 700; }

  .mensal { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--muted); }
  .mensal b { color: var(--text); }

  .itens { display: flex; flex-wrap: wrap; gap: 5px; }
  .item { font-family: -apple-system, sans-serif; font-size: 11px; padding: 3px 8px;
    border-radius: 4px; background: var(--good-bg); border: 1px solid var(--good-border);
    color: var(--good); cursor: pointer; }
  .item.off { background: transparent; border-color: var(--border); color: #4b5563; }
  .item:hover { border-color: var(--good); }
  .item.off:hover { border-color: var(--muted); color: var(--muted); }

  .card-foot { display: flex; gap: 8px; align-items: center; margin-top: auto; padding-top: 4px; }
  .card-foot select { flex: 0 0 auto; font-size: 12px; padding: 5px 8px; }
  .card-foot a { margin-left: auto; font-family: -apple-system, sans-serif; font-size: 12px;
    color: var(--accent); text-decoration: none; font-weight: 600; }
  .card-foot a + a { margin-left: 0; }
  .card-foot a:hover { text-decoration: underline; }
  .nota { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 9px; font-family: -apple-system, sans-serif; font-size: 12px;
    resize: vertical; min-height: 34px; }
  .nota::placeholder { color: #4b5563; }

  /* ── TABELA ────────────────────────────── */
  .wrap-tabela { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-family: -apple-system, sans-serif; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--surface2); color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  tbody tr:hover { background: var(--surface); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.descartado { opacity: .4; }

  h2 { font-size: 20px; margin: 40px 0 6px; letter-spacing: -.01em; }
  h2:first-of-type { margin-top: 0; }
  .h2sub { font-family: -apple-system, sans-serif; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .vazio { color: var(--muted); font-family: -apple-system, sans-serif; padding: 40px; text-align: center; }

  @media (max-width: 720px) {
    .controls { gap: 8px; }
    .spacer { display: none; }
    #chips-bairro {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      scrollbar-width: none;
      width: 100%;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    #chips-bairro::-webkit-scrollbar { display: none; }
    #chips-bairro .chip { flex: 0 0 auto; }
    .chip, select { font-size: 12px; padding: 8px 12px; }
    /* alvos de toque: os chips de item sao usados de pe, na visita */
    .item { font-size: 12px; padding: 7px 10px; }
    .fav { font-size: 22px; padding: 6px; }
    .descartar { font-size: 18px; padding: 6px 8px; }
    .card-foot select { font-size: 13px; padding: 8px 10px; }
    .site-header { padding: 0 14px; height: auto; flex-direction: column;
      align-items: flex-start; gap: 6px; padding: 10px 14px; }
    .header-stats { gap: 16px; }
    main { padding: 20px 14px 60px; }
  }
</style>
</head>

  <div class="header-stats" id="stats"></div>

</main>

  {"bairro": "Vila Ipojuca", "endereco": "Rua Capitão Alceu Vieira, 44", "privado": false, "cobertura": false, "andar": null, "m2": 138, "qts": 3, "vgs": 2, "link": "https://maramores.com.br/imovel/AP2434", "link2": "https://www.quintoandar.com.br/imovel/894760488/comprar/apartamento-3-quartos-vila-ipojuca-sao-paulo", "foto": "https://img.maramores.com.br/imoveis-propriedades/ativas/AP2434/fotos/1787776009612_ccf483e4-0f43-4fec-b7b9-06748aba1737.JPG?w=1200&q=82", "cond": 2200, "iptu": 792, "valor": 2250000, "add": "2026-08-29", "itens": ["Churrasq. prédio", "Academia", "Piscina", "Depósito Garagem"]},
  {"bairro": "Vila Ipojuca", "endereco": "Rua Tonelero, 239", "privado": false, "cobertura": false, "andar": 10, "m2": 145, "qts": 3, "vgs": 2, "link": "https://www.vivareal.com.br/imovel/apartamento-3-quartos-vila-ipojuca-sao-paulo-com-garagem-145m2-venda-RS1620000-id-2909182359/", "foto": "https://resizedimgs.vivareal.com/img/vr-listing/92b7c00f9d5677620552c6de8ab27508/apartamento-com-3-quartos-a-venda-145m-no-vila-ipojuca-sao-paulo.webp?action=fit-in&dimension=870x707", "cond": 2067, "iptu": 0, "valor": 1620000, "add": "2026-09-02", "itens": ["Escritório", "Ar Condicionado", "Closet", "Varanda fechada", "Máquina Louça", "Academia", "Piscina"]},
  {"bairro": "Perdizes", "endereco": "Rua Cardoso de Almeida, 704", "privado": false, "cobertura": false, "andar": null, "m2": 160, "qts": 3, "vgs": 2, "link": "https://www.vivareal.com.br/imovel/apartamento-3-quartos-perdizes-zona-oeste-sao-paulo-com-garagem-160m2-venda-RS1800000-id-2909465713/", "foto": "https://resizedimgs.vivareal.com/img/vr-listing/ca553ef98f5e1bd907898731f3129b4d/apartamento-com-3-quartos-a-venda-160m-no-perdizes-sao-paulo.webp?action=fit-in&dimension=870x707", "cond": 1970, "iptu": 560, "valor": 1800000, "add": "2026-09-02", "itens": ["Churrasq. prédio", "Escritório", "Máquina Louça", "Academia", "Piscina"]}
]};
const KEY = 'imoveis-2027:';
const brl = n => 'R$ ' + Math.round(n).toLocaleString('pt-BR');
const CHAVES = ['fav', 'status', 'nota', 'itens'];
const b64e = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o))));
const b64d = t => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t), c => c.charCodeAt(0))));

// Estado publicado no repo: ao mudar `estadoVersao`, todos os aparelhos adotam
// esse estado uma vez, descartando o que tinham localmente. E o ponto de sincronia.
if (localStorage.getItem(KEY + '_versao') !== JSON.stringify(D.estadoVersao)) {
  Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k));
  Object.entries(D.estado).forEach(([k, v]) => localStorage.setItem(KEY + k, JSON.stringify(v)));
  localStorage.setItem(KEY + '_versao', JSON.stringify(D.estadoVersao));
}

if (location.hash.startsWith('#s=')) {
  try {
    Object.entries(b64d(location.hash.slice(3))).forEach(([k, v]) => localStorage.setItem(KEY + k, JSON.stringify(v)));
    history.replaceState(null, '', location.pathname);
  } catch (e) { console.warn('link de dados invalido', e); }
}

const st = { bairros: new Set(), fav: false, desc: false, ordem: 'mensal', dir: 1, tabela: false, sortCol: null, sortDir: 1 };

// Dois imoveis podem ter mesmo endereco e metragem (unidades diferentes do mesmo
// predio): o contador garante id unico, senao um sobrescreve o estado do outro.
const usados = {};
D.apts.forEach((a, i) => {
  const base = (a.endereco + '-' + a.m2).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  usados[base] = (usados[base] || 0) + 1;
  a.id = usados[base] > 1 ? base + '-' + usados[base] : base;
  a.m2v = a.valor / a.m2;
  a.mensal = a.cond + a.iptu;
  a.n = a.itens.length;
  a.addN = Date.parse(a.add || '2026-08-24');
});
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(KEY + k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(KEY + k, JSON.stringify(v));
const saveStatus = (id, v) => { save('status:' + id, v); if (v === 'descartado') localStorage.removeItem(KEY + 'fav:' + id); };

// Itens podem ser corrigidos na visita: o override vence o que veio do anuncio.
const itensDe = a => load('itens:' + a.id, a.itens);

const m2vals = D.apts.map(a => a.m2v).sort((x, y) => x - y);
const q1 = m2vals[Math.floor(m2vals.length * .25)], q3 = m2vals[Math.floor(m2vals.length * .75)];

function stats() {
  const vis = filtrar();
  const vals = vis.map(a => a.valor);
  document.getElementById('stats').innerHTML = vis.length ? `
    <div>imoveis<b>${vis.length}</b></div>
    <div>faixa<b>${brl(Math.min(...vals) / 1000)}k &ndash; ${brl(Math.max(...vals) / 1000).replace('R$ ', '')}k</b></div>
    <div>R$/m&sup2; mediano<b>${brl(vis.map(a => a.m2v).sort((x, y) => x - y)[Math.floor(vis.length / 2)])}</b></div>
    <div>favoritos<b>${D.apts.filter(a => load('fav:' + a.id, false)).length}</b></div>` : '';
}

function filtrar() {
  return D.apts.filter(a => {
    const s = load('status:' + a.id, 'a-visitar');
    // O chip alterna entre a lista ativa e a lista de descartados: nunca as duas.
    if ((s === 'descartado') !== st.desc) return false;
    if (st.fav && !load('fav:' + a.id, false)) return false;
    if (st.bairros.size && !st.bairros.has(a.bairro)) return false;
    return true;
  });
}
const dmy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const CHAVE = { mensal: a => a.mensal, m2v: a => a.m2v, valor: a => a.valor,
                m2: a => a.m2, itens: a => itensDe(a).length, add: a => a.addN };
function ordenar(l) {
  const k = CHAVE[st.ordem];
  return l.slice().sort((a, b) => (k(a) - k(b)) * st.dir);
}

function cardHTML(a) {
  const s = load('status:' + a.id, 'a-visitar');
  const fav = load('fav:' + a.id, false);
  const cls = a.m2v <= q1 ? 'barato' : a.m2v >= q3 ? 'caro' : '';
  const andar = a.andar ? (isNaN(a.andar) ? a.andar : a.andar + '&ordm; andar') : 'andar n/d';
  return `<div class="card st-${s}" data-id="${a.id}">
    ${a.foto ? `<a class="card-foto-link" href="${a.link}" target="_blank" rel="noopener"><img class="card-foto"
      src="${a.foto}" alt="Abrir anuncio de ${a.endereco}" loading="lazy" decoding="async"
      referrerpolicy="no-referrer" onerror="this.remove()"></a>` : ''}
    <div class="card-top">
      <div>
        <div class="bairro">${a.bairro}${a.cobertura ? ' &middot; cobertura' : ''}</div>
        <div class="endereco">${a.endereco}</div>
        <div class="sub">${andar}${a.privado ? ' &middot; endereco so na visita' : ''} &middot; entrou ${dmy(a.add || '2026-08-24')}</div>
      </div>
      <div class="card-acoes">
        <button class="fav ${fav ? 'on' : ''}" title="favoritar">&#9733;</button>
        <button class="descartar" title="${s === 'descartado' ? 'recuperar' : 'descartar'}">${s === 'descartado' ? '&#8634;' : '&#10005;'}</button>
      </div>
    </div>
    <div class="preco"><b>${brl(a.valor)}</b><span class="m2v ${cls}">${brl(a.m2v)}/m&sup2;</span></div>
    <div class="specs">
      <span><b>${a.m2}</b> m&sup2;</span><span><b>${a.qts}</b> qts</span><span><b>${a.vgs}</b> vagas</span>
    </div>
    <div class="mensal">Mensal <b>${brl(a.mensal)}</b> &middot; cond. ${brl(a.cond)} + IPTU ${brl(a.iptu)}</div>
    <div class="itens">${(sel => D.amenidades.map(i =>
      `<button class="item ${sel.includes(i) ? '' : 'off'}" data-item="${i}"
        title="clique para marcar ou desmarcar">${i}</button>`).join(''))(itensDe(a))}</div>
    <textarea class="nota" placeholder="anotacoes...">${load('nota:' + a.id, '')}</textarea>
    <div class="card-foot">
      <select>${['a-visitar', 'agendado', 'visitado', 'descartado'].map(o =>
        `<option value="${o}" ${o === s ? 'selected' : ''}>${o.replace('-', ' ')}</option>`).join('')}</select>
      <a href="${a.link}" target="_blank" rel="noopener">ver anuncio &rarr;</a>
      ${a.link2 ? `<a href="${a.link2}" target="_blank" rel="noopener">2&ordm; anuncio &rarr;</a>` : ''}
    </div>
  </div>`;
}

const COLS = [['bairro', 'Bairro', 0], ['endereco', 'Endereco', 0], ['m2', 'm2', 1], ['qts', 'Qts', 1],
  ['vgs', 'Vgs', 1], ['valor', 'Valor', 1], ['m2v', 'R$/m2', 1], ['cond', 'Cond.', 1],
  ['iptu', 'IPTU', 1], ['mensal', 'Mensal', 1], ['n', 'Itens', 1], ['add', 'Entrou', 0]];

function tabelaHTML(l) {
  if (st.sortCol) l = l.slice().sort((a, b) => (a[st.sortCol] > b[st.sortCol] ? 1 : -1) * st.sortDir);
  return `<div class="wrap-tabela"><table><thead><tr>${
    COLS.map(c => `<th data-col="${c[0]}">${c[1]}${st.sortCol === c[0] ? (st.sortDir > 0 ? ' &uarr;' : ' &darr;') : ''}</th>`).join('')
  }<th></th></tr></thead><tbody>${l.map(a => {
    const s = load('status:' + a.id, 'a-visitar');
    return `<tr class="${s}">${COLS.map(c => {
      let v = c[0] === 'n' ? itensDe(a).length : a[c[0]];
      if (c[0] === 'add') v = dmy(a.add || '2026-08-24');
      if (['valor', 'm2v', 'cond', 'iptu', 'mensal'].includes(c[0])) v = brl(v);
      return `<td class="${c[2] ? 'num' : ''}">${v}</td>`;
    }).join('')}<td><a href="${a.link}" target="_blank" rel="noopener" style="color:var(--accent)">link</a>${a.link2 ? ` <a href="${a.link2}" target="_blank" rel="noopener" style="color:var(--accent)">2</a>` : ''}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function render() {
  const l = ordenar(filtrar());
  const el = document.getElementById('lista');
  el.innerHTML = !l.length ? '<div class="vazio">Nenhum imovel com esses filtros.</div>'
    : st.tabela ? tabelaHTML(l) : '<div class="grid">' + l.map(cardHTML).join('') + '</div>';
  stats();
}

document.getElementById('chips-bairro').innerHTML =
  [...new Set(D.apts.map(a => a.bairro))].sort().map(b => `<button class="chip" data-b="${b}">${b}</button>`).join('');

document.addEventListener('click', e => {
  const c = e.target.closest('[data-b]');
  if (c) { const b = c.dataset.b; st.bairros.has(b) ? st.bairros.delete(b) : st.bairros.add(b);
    c.classList.toggle('on'); return render(); }
  if (e.target.id === 'chip-fav') { st.fav = !st.fav; e.target.classList.toggle('on'); return render(); }
  if (e.target.id === 'chip-desc') { st.desc = !st.desc; e.target.classList.toggle('on'); return render(); }
  if (e.target.id === 'chip-vista') { st.tabela = !st.tabela;
    e.target.textContent = st.tabela ? 'Cards' : 'Tabela'; e.target.classList.toggle('on'); return render(); }
  const th = e.target.closest('th[data-col]');
  if (th) { const c2 = th.dataset.col; st.sortDir = st.sortCol === c2 ? -st.sortDir : 1; st.sortCol = c2; return render(); }
  const it = e.target.closest('.item');
  if (it) {
    const a = D.apts.find(ap => ap.id === it.closest('.card').dataset.id);
    const sel = itensDe(a), nome = it.dataset.item;
    save('itens:' + a.id, sel.includes(nome)
      ? sel.filter(i => i !== nome)
      : D.amenidades.filter(i => i === nome || sel.includes(i)));
    return render();
  }
  const x = e.target.closest('.descartar');
  if (x) { const id = x.closest('.card').dataset.id;
    saveStatus(id, load('status:' + id, 'a-visitar') === 'descartado' ? 'a-visitar' : 'descartado');
    return render(); }
  const f = e.target.closest('.fav');
  if (f) { const id = f.closest('.card').dataset.id;
    save('fav:' + id, !load('fav:' + id, false)); return render(); }
});
document.getElementById('ordem').addEventListener('change', e => { st.ordem = e.target.value; render(); });
document.getElementById('dir').addEventListener('click', e => {
  st.dir = -st.dir;
  e.target.innerHTML = st.dir > 0 ? '&uarr; menor' : '&darr; maior';
  render();
});
document.addEventListener('change', e => {
  const card = e.target.closest('.card');
  if (card && e.target.tagName === 'SELECT') { saveStatus(card.dataset.id, e.target.value); render(); }
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('nota'))
    save('nota:' + e.target.closest('.card').dataset.id, e.target.value);
});

document.getElementById('backup').addEventListener('click', async e => {
  const o = {};
  D.apts.forEach(a => CHAVES.forEach(k => {
    const v = load(k + ':' + a.id, null);
    if (v && v !== 'a-visitar') o[k + ':' + a.id] = v;
  }));
  const url = location.origin + location.pathname + '#s=' + b64e(o);
  try { await navigator.clipboard.writeText(url); } catch { prompt('Copie o link:', url); }
  e.target.textContent = '\u2713 link copiado';
  e.target.classList.add('ok');
  setTimeout(() => { e.target.innerHTML = '&#128279; copiar meus dados'; e.target.classList.remove('ok'); }, 2500);
});

render();
</script>
</body>
</html>
