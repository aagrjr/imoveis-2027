<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Apartamentos 2027</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #1c2230; --border: #2a3140;
    --text: #e6edf3; --muted: #7d8590;
    --good: #34d399; --good-bg: #061f17; --good-border: #0d4a30;
    --warn: #fbbf24; --warn-bg: #1f1708; --warn-border: #4a3500;
    --bad: #f87171; --bad-bg: #2a0f0f; --bad-border: #5c1d1d;
    --accent: #60a5fa; --accent-bg: #0d1f3c; --accent-border: #1e3a5f;
  }
  html { scroll-behavior: smooth; font-size: 16px; }
  body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  .site-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 24px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; gap: 16px;
  }
  .site-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em;
    font-family: -apple-system, sans-serif; white-space: nowrap; }
  .header-stats { display: flex; gap: 22px; font-family: -apple-system, sans-serif;
    font-size: 12px; color: var(--muted); }
  .header-stats b { display: block; color: var(--text); font-size: 15px; font-weight: 700; }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  /* ── CONTROLES ─────────────────────────── */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 22px; font-family: -apple-system, sans-serif; font-size: 13px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: .12s;
  }
  .chip:hover { border-color: var(--accent-border); color: var(--text); }
  .chip.on { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
  select, .toggle {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .spacer { flex: 1; }

  /* ── CARDS ─────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px; position: relative;
  }
  .card.st-agendado { border-color: var(--warn-border); }
  .card.st-visitado { border-color: var(--good-border); }
  .card-foto {
    display: block; width: calc(100% + 36px); height: 150px; object-fit: cover;
    margin: -16px -18px 2px; border-radius: 9px 9px 0 0; background: var(--surface2);
  }
  .card-foto-link { display: block; }
  .card.st-descartado .card-foto { filter: grayscale(1); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .bairro { font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .endereco { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin-top: 2px; }
  .sub { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .fav { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1;
    color: var(--border); padding: 2px; }
  .fav.on { color: var(--warn); }
  .card-acoes { display: flex; gap: 2px; align-items: center; }
  .descartar { background: none; border: none; cursor: pointer; font-size: 15px; line-height: 1;
    color: var(--border); padding: 2px 4px; font-family: -apple-system, sans-serif; }
  .descartar:hover { color: var(--bad); }
  .card.st-descartado .descartar { color: var(--bad); }
  .card.st-descartado { opacity: .45; }
  .card.st-descartado:hover { opacity: .8; }
  #backup { background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 11px; border-radius: 6px; cursor: pointer; font-family: -apple-system, sans-serif;
    font-size: 12px; white-space: nowrap; }
  #backup:hover { color: var(--text); border-color: var(--accent-border); }
  #backup.ok { color: var(--good); border-color: var(--good-border); }

  .preco { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .preco b { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-family: -apple-system, sans-serif; }
  .m2v { font-family: -apple-system, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
  .m2v.barato { background: var(--good-bg); border-color: var(--good-border); color: var(--good); }
  .m2v.caro { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }

  .specs { display: flex; gap: 14px; font-family: -apple-system, sans-serif; font-size: 13px;
    color: var(--muted); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 9px 0; }
  .specs span b { color: var(--text); font-weight: 700; }

  .mensal { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--muted); }
  .mensal b { color: var(--text); }

  .itens { display: flex; flex-wrap: wrap; gap: 5px; }
  .item { font-family: -apple-system, sans-serif; font-size: 11px; padding: 3px 8px;
    border-radius: 4px; background: var(--good-bg); border: 1px solid var(--good-border);
    color: var(--good); cursor: pointer; }
  .item.off { background: transparent; border-color: var(--border); color: #4b5563; }
  .item:hover { border-color: var(--good); }
  .item.off:hover { border-color: var(--muted); color: var(--muted); }

  .card-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: auto; padding-top: 4px; }
  .card-foot select { flex: 0 0 auto; font-size: 12px; padding: 5px 8px; }
  .card-foot a { margin-left: auto; font-family: -apple-system, sans-serif; font-size: 12px;
    color: var(--accent); text-decoration: none; font-weight: 600; }
  .card-foot a + a { margin-left: 0; }
  .card-foot a:hover { text-decoration: underline; }
  .nota { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 9px; font-family: -apple-system, sans-serif; font-size: 12px;
    resize: vertical; min-height: 34px; }
  .nota::placeholder { color: #4b5563; }

  /* ── TABELA ────────────────────────────── */
  .wrap-tabela { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-family: -apple-system, sans-serif; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--surface2); color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  tbody tr:hover { background: var(--surface); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.descartado { opacity: .4; }

  h2 { font-size: 20px; margin: 40px 0 6px; letter-spacing: -.01em; }
  h2:first-of-type { margin-top: 0; }
  .h2sub { font-family: -apple-system, sans-serif; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .vazio { color: var(--muted); font-family: -apple-system, sans-serif; padding: 40px; text-align: center; }

  @media (max-width: 720px) {
    .controls { gap: 8px; }
    .spacer { display: none; }
    .chip, select { font-size: 12px; padding: 8px 12px; }
    /* alvos de toque: os chips de item sao usados de pe, na visita */
    .item { font-size: 12px; padding: 7px 10px; }
    .fav { font-size: 22px; padding: 6px; }
    .descartar { font-size: 18px; padding: 6px 8px; }
    .card-foot select { font-size: 13px; padding: 8px 10px; }
    .site-header { padding: 0 14px; height: auto; flex-direction: column;
      align-items: flex-start; gap: 6px; padding: 10px 14px; }
    .header-stats { gap: 16px; }
    main { padding: 20px 14px 60px; }
  }

  /* ── MAPA ──────────────────────────────── */
  .mapa { position: relative; height: 72vh; min-height: 420px; overflow: hidden; border: 1px solid var(--border);
    border-radius: 10px; background: #e8e6e1; touch-action: none; cursor: grab; user-select: none; }
  .mapa.arrastando { cursor: grabbing; }
  .mapa .tile { position: absolute; width: 256px; height: 256px; pointer-events: none; }
  .pin { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; color: #0d1117; font: 700 11px -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px #0009; cursor: pointer; z-index: 2; }
  .pin.fav { background: var(--warn); }
  .pin.rev { background: var(--good); }
  .pin.desc { background: #9ca3af; }
  .pin.aprox { border-style: dashed; }
  .mapa-pop { position: absolute; z-index: 5; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font: 13px -apple-system, sans-serif; max-width: calc(100% - 20px); max-height: 340px;
    display: grid; gap: 12px; grid-template-columns: repeat(var(--n), 240px);
    overflow-y: auto; transform: translate(-50%, calc(-100% - 16px)); box-shadow: 0 4px 16px #000a; cursor: auto; }
  .mapa-pop.abaixo { transform: translate(-50%, 16px); }
  .pop-foto { display: block; width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 6px;
    background: var(--surface2); }
  .mapa-pop > div + div { border-left: 1px solid var(--border); padding-left: 12px; margin-left: -1px; }
  .mapa-pop a { color: var(--accent); }
  .mapa-zoom { position: absolute; right: 10px; top: 10px; z-index: 4; display: flex; flex-direction: column; gap: 4px; }
  .mapa-zoom button { width: 32px; height: 32px; font-size: 18px; border-radius: 6px; border: 1px solid #0003;
    background: #fff; color: #333; cursor: pointer; }
  .mapa-attr { position: absolute; right: 0; bottom: 0; z-index: 4; font: 10px sans-serif; background: #fffc;
    color: #333; padding: 1px 6px; }
  .mapa-attr a { color: #333; }
</style>
</head>

</main>

// Mapa sem biblioteca: tiles do OpenStreetMap posicionados em Web Mercator.
// Pins no mesmo predio viram um so, com contagem. `aprox` = ponto do anuncio (~150 m) ou so a rua.
const TILE = (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;

    for (let ty = Math.floor(y0 / 256); ty * 256 < y0 + h; ty++) {

        <a href="${a.link}" target="_blank" rel="noopener">anuncio &rarr;</a> &middot;
        ${a.link2 ? `<a href="${a.link2}" target="_blank" rel="noopener">2&ordm; anuncio &rarr;</a> &middot;` : ''}
        ${a.link3 ? `<a href="${a.link3}" target="_blank" rel="noopener">3&ordm; anuncio &rarr;</a> &middot;` : ''}
        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">Google Maps &nearr;</a></div>`;
    }).join('')}</div>`;
  });
  el.insertAdjacentHTML('beforeend', html);
}

function mapaZoom(dz, mx, my) {
  const z = Math.min(18, Math.max(10, mp.z + dz)); if (z === mp.z) return;
  const w = mp.el.clientWidth, h = mp.el.clientHeight, f = 2 ** (z - mp.z);
  mx = mx ?? w / 2; my = my ?? h / 2;
  mp.cx = (mp.cx - w / 2 + mx) * f - mx + w / 2; mp.cy = (mp.cy - h / 2 + my) * f - my + h / 2; mp.z = z;
  mapaDesenhar();
}

let arr = null;
document.addEventListener('pointerdown', e => {
  if (!mp || !e.target.closest('.mapa') || e.target.closest('.pin, .mapa-pop, .mapa-zoom, .mapa-attr')) return;
  arr = { x: e.clientX, y: e.clientY, cx: mp.cx, cy: mp.cy, moveu: false };
  mp.el.classList.add('arrastando'); mp.el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!arr) return;
  const dx = e.clientX - arr.x, dy = e.clientY - arr.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) arr.moveu = true;
  mp.cx = arr.cx - dx; mp.cy = arr.cy - dy; mapaDesenhar();
});
document.addEventListener('pointerup', () => {
  if (!arr) return;
  if (!arr.moveu && mp.aberto !== null) { mp.aberto = null; mapaDesenhar(); }
  mp.el.classList.remove('arrastando'); arr = null;
});
document.addEventListener('wheel', e => {
  const el = e.target.closest('.mapa'); if (!el || !mp || e.target.closest('.mapa-pop')) return;
  e.preventDefault(); const r = el.getBoundingClientRect();
  mapaZoom(e.deltaY < 0 ? 1 : -1, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
window.addEventListener('resize', () => { if (st.mapa && mp && document.contains(mp.el)) mapaDesenhar(); });

document.addEventListener('click', e => {
  if (e.target.id === 'chip-fav') { st.fav = !st.fav; e.target.classList.toggle('on'); return render(); }
  if (e.target.id === 'chip-rev') { st.rev = !st.rev; e.target.classList.toggle('on'); return render(); }
  if (e.target.id === 'chip-desc') { st.desc = !st.desc; e.target.classList.toggle('on'); return render(); }
  if (e.target.id === 'chip-mapa') { st.mapa = !st.mapa; e.target.classList.toggle('on'); return render(); }
  const pin = e.target.closest('.pin');
  if (pin) { const i = +pin.dataset.g; mp.aberto = mp.aberto === i ? null : i; return mapaDesenhar(); }
  const zb = e.target.closest('.mapa-zoom button');
  if (zb) return mapaZoom(+zb.dataset.z);
  if (e.target.id === 'chip-vista') { st.tabela = !st.tabela;
    e.target.textContent = st.tabela ? 'Cards' : 'Tabela'; e.target.classList.toggle('on'); return render(); }
  const th = e.target.closest('th[data-col]');
  if (th) { const c2 = th.dataset.col; st.sortDir = st.sortCol === c2 ? -st.sortDir : 1; st.sortCol = c2; return render(); }
  const it = e.target.closest('.item');
  if (it) {
    const a = D.apts.find(ap => ap.id === it.closest('.card').dataset.id);
    const sel = itensDe(a), nome = it.dataset.item;
    save('itens:' + a.id, sel.includes(nome)
      ? sel.filter(i => i !== nome)
      : D.amenidades.filter(i => i === nome || sel.includes(i)));
    return render();
  }
  const x = e.target.closest('.descartar');
  if (x) { const id = x.closest('.card').dataset.id;
    saveStatus(id, load('status:' + id, 'a-visitar') === 'descartado' ? 'a-visitar' : 'descartado');
    return render(); }
  const f = e.target.closest('.fav');
  if (f) { const id = f.closest('.card').dataset.id;
    save('fav:' + id, !load('fav:' + id, false)); return render(); }
});
document.getElementById('ordem').addEventListener('change', e => { st.ordem = e.target.value; render(); });
document.getElementById('dir').addEventListener('click', e => {
  st.dir = -st.dir;
  e.target.innerHTML = st.dir > 0 ? '&uarr; menor' : '&darr; maior';
  render();
});
document.addEventListener('change', e => {
  const card = e.target.closest('.card');
  if (card && e.target.tagName === 'SELECT') { saveStatus(card.dataset.id, e.target.value); render(); }
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('nota'))
    save('nota:' + e.target.closest('.card').dataset.id, e.target.value);
});

document.getElementById('backup').addEventListener('click', async e => {
  const o = {};
  D.apts.forEach(a => CHAVES.forEach(k => {
    const v = load(k + ':' + a.id, null);
    if (v && v !== 'a-visitar') o[k + ':' + a.id] = v;
  }));
  const url = location.origin + location.pathname + '#s=' + b64e(o);
  try { await navigator.clipboard.writeText(url); } catch { prompt('Copie o link:', url); }
  e.target.textContent = '\u2713 link copiado';
  e.target.classList.add('ok');
  setTimeout(() => { e.target.innerHTML = '&#128279; copiar meus dados'; e.target.classList.remove('ok'); }, 2500);
});

render();
</script>
</body>
